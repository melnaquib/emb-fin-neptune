[project]
name = "ivd"
version = "0.1.0"
description = "Invoice verification voice demo — testnet rails, no real money."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "uvloop>=0.20; sys_platform != 'win32'",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "mcp>=1.9,<2",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
ivd = "ivd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
